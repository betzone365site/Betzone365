<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BET ZONE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #071b12;
    color: white;
}

header {
    background: #0b2619;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #20a35a;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #20d66b;
}

.demo {
    background: #20a35a;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 13px;
}

.banner {
    padding: 30px 20px;
    text-align: center;
    background: linear-gradient(135deg, #0d3b24, #092218);
}

.banner h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.banner p {
    color: #b9c9c1;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.section-title {
    font-size: 20px;
    margin: 10px 0 15px;
}

.match {
    background: #0d2a1c;
    border: 1px solid #194b31;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 12px;
}

.teams {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-weight: bold;
}

.odds {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.odd {
    background: #123d28;
    border: 1px solid #246b43;
    padding: 12px 5px;
    border-radius: 6px;
    text-align: center;
}

.odd span {
    display: block;
    color: #91aaa0;
    font-size: 12px;
    margin-bottom: 5px;
}

.odd strong {
    color: #20d66b;
    font-size: 17px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #82968d;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">BET ZONE</div>
    <div class="demo">DEMO MODE</div>
</header>

<section class="banner">
    <h1>BET ZONE</h1>
    <p>Sports odds demo — vetëm për argëtim</p>
</section>

<div class="container">

    <div class="section-title">⚽ Futboll</div>

    <div class="match">
        <div class="teams">
            <span>Barcelona</span>
            <span>Real Madrid</span>
        </div>

        <div class="odds">
            <div class="odd">
                <span>1</span>
                <strong>2.10</strong>
            </div>

            <div class="odd">
                <span>X</span>
                <strong>3.40</strong>
            </div>

            <div class="odd">
                <span>2</span>
                <strong>2.80</strong>
            </div>
        </div>
    </div>

    <div class="match">
        <div class="teams">
            <span>Manchester City</span>
            <span>Liverpool</span>
        </div>

        <div class="odds">
            <div class="odd">
                <span>1</span>
                <strong>1.75</strong>
            </div>

            <div class="odd">
                <span>X</span>
                <strong>3.80</strong>
            </div>

            <div class="odd">
                <span>2</span>
                <strong>3.20</strong>
            </div>
        </div>
    </div>

    <div class="match">
        <div class="teams">
            <span>Juventus</span>
            <span>Inter</span>
        </div>

        <div class="odds">
            <div class="odd">
                <span>1</span>
                <strong>2.30</strong>
            </div>

            <div class="odd">
                <span>X</span>
                <strong>3.10</strong>
            </div>

            <div class="odd">
                <span>2</span>
                <strong>2.65</strong>
            </div>
        </div>
    </div>

</div>

<footer>
    BET ZONE © 2026 — Demo website. No real-money betting.
</footer>

</body>
</html>
